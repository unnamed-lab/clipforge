name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web:
    name: Web
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 12.11.2
      - uses: actions/setup-node@v4
        with:
          node-version: 22.14.0
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @clipforge/web typecheck
      - run: pnpm --filter @clipforge/web lint
      - run: pnpm --filter @clipforge/shared test
      - run: pnpm --filter @clipforge/web test
      - run: pnpm --filter @clipforge/web build
        env:
          CLIPFORGE_WORKER_URL: http://127.0.0.1:8788
          CLIPFORGE_WORKER_TOKEN: build-only-placeholder

  worker:
    name: Worker
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: apps/worker/pyproject.toml
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg fonts-dejavu-core
      - run: python -m pip install -e "apps/worker[dev]"
      - run: python -m ruff check src tests
        working-directory: apps/worker
      - run: python -m pytest -m "not slow"
        working-directory: apps/worker
        env:
          CLIPFORGE_DATA_DIR: ${{ runner.temp }}/clipforge-data

  containers:
    name: Containers
    runs-on: ubuntu-24.04
    needs: [web, worker]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.14.0
      - run: node scripts/docker-verify.mjs
