[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "clipforge-worker"
version = "0.1.0"
description = "Local media processing service for Clipforge"
requires-python = ">=3.11,<3.14"
dependencies = [
  "fastapi>=0.115,<1.0",
  "uvicorn>=0.32,<1.0",
  "python-multipart>=0.0.12",
  "pydantic>=2.9,<3.0",
  "httpx>=0.27,<1.0",
  "faster-whisper>=1.1,<2.0",
  "yt-dlp>=2024.10",
  "Pillow>=10.4,<13.0",
  "onnxruntime>=1.20,<2.0",
  "numpy>=1.26,<3.0",
  "opencv-contrib-python-headless>=4.10,<5.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3",
  "pytest-timeout>=2.3",
  "ruff>=0.9,<1.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
# schema.sql is read at startup; without this it exists in the source tree and
# editable installs but not in the wheel used by the container image.
clipforge = [
  "db/*.sql",
  "rendering/fonts/*.ttf",
  "rendering/fonts/*.otf",
  "rendering/fonts/*.md",
  "rendering/fonts/*.txt",
  "media/models/*.onnx",
  "media/models/*.txt",
  "enhancement/models/*.pb",
  "enhancement/models/*.txt",
  "enhancement/models/*.md",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"
markers = [
  "integration: exercises real FFmpeg/media processing",
  "slow: exercises real faster-whisper model inference",
]
filterwarnings = ["ignore::DeprecationWarning"]

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
# Errors and undefined names first: a real gate without a style rewrite.
select = ["E9", "F"]
